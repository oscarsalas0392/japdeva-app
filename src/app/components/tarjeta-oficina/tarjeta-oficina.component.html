<div class="seccion-card">
  <div class="seccion-card__header">
    <ion-icon name="location-outline" />
    <h2>Oficinas de atención</h2>
  </div>
  <p class="seccion-card__nombre">{{ nombre }}</p>
  <p class="seccion-card__texto">{{ direccion }}</p>
  <div class="seccion-card__horario">
    <ion-icon name="time-outline" />
    <span>{{ horario }}</span>
  </div>
</div>
