<ion-content class="fondo" [scrollY]="false">
  <app-decoracion-login posicion="top" />
  <app-decoracion-login posicion="bottom" />
  <div class="contenedor">

    <app-logo-japdeva />

    <ion-card class="login-card">
      <ion-card-content>

        <h2 class="titulo">{{ 'inicioSesion.titulo' | translate }}</h2>

        <form [formGroup]="form" (ngSubmit)="enviar()">

          <app-grupo-campo>

            <!-- Correo enmascarado: al tocarlo se borra y permite editar -->
            @if (correoGuardado && !correoEditando) {
              <div class="campo-enmascarado" (click)="editarCorreo()">
                {{ correoGuardado | mascaraCorreo }}
              </div>
            } @else {
              <app-campo-formulario
                [control]="form.get('usuario')!"
                tipo="email"
                placeholder="inicioSesion.usuario"
                autocomplete="email"
                mensajeError="inicioSesion.validacion.correoInvalido"
                [enviado]="enviado"
              />
            }

            <app-campo-formulario
              [control]="form.get('contrasena')!"
              tipo="password"
              placeholder="inicioSesion.contrasena"
              autocomplete="current-password"
              mensajeError="inicioSesion.validacion.contrasenaMínima"
              [enviado]="enviado"
            />

          </app-grupo-campo>

          <div class="recordar-fila">
            <app-check
              label="inicioSesion.recordarCorreo"
              [(checked)]="recordar"
            />
          </div>

          <app-grupo-campo>
            <app-enlaces-login />
          </app-grupo-campo>

          <app-grupo-campo [top]="true" [bottom]="false">
            <app-boton-cargando
              etiqueta="inicioSesion.ingresar"
              [cargando]="cargando"
            />
          </app-grupo-campo>

        </form>

        @if (biometriaDisponible) {
          <div class="biometria-separador">
            <span>{{ 'inicioSesion.o' | translate }}</span>
          </div>
          <button type="button" class="biometria-btn" (click)="autenticarConBiometria()">
            <ion-icon name="finger-print-outline" />
            {{ (esFaceId ? 'inicioSesion.usarFaceId' : 'inicioSesion.usarHuella') | translate }}
          </button>
        }

      </ion-card-content>
    </ion-card>

  </div>
</ion-content>
