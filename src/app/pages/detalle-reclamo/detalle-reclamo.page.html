<app-pagina titulo="{{ 'detalleReclamo.titulo' | translate }}" [atras]="true" [cargando]="cargando()">
  @if (reclamo()) {
    <div class="pagina">

      <p class="consecutivo">{{ 'detalleReclamo.consecutivo' | translate }}: {{ codigo }}</p>

      <app-campo-detalle
        titulo="detalleReclamo.tituloReclamo"
        [valor]="reclamo()!.titulo"
      />

      <app-campo-detalle
        titulo="detalleReclamo.descripcion"
        [valor]="reclamo()!.descripcion"
      />

      <app-lista-documentos [documentos]="documentos()" />

      <!-- Estado actual -->
      <section class="seccion">
        <h2 class="seccion__titulo">{{ 'detalleReclamo.seguimiento' | translate }}</h2>
        <div class="estado-actual">
          <span class="estado-actual__badge" [class]="claseEstado">{{ reclamo()!.descripcionEstadoReclamo }}</span>
          @if (estadoActual?.fechaRegistro) {
            <span class="estado-actual__fecha">{{ generales.formatearFecha(estadoActual!.fechaRegistro) }}</span>
          }
        </div>
      </section>

    </div>
  }
</app-pagina>
